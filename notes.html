<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes | Sanju Singh</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://sanju-portfolio-notes-default-rtdb.asia-southeast1.firebasedatabase.app" crossorigin>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="custom-cursor">
        <div class="cursor-shape">
            <span class="cursor-text-content"></span>
        </div>
    </div>

    <main class="main-frame">
        <div class="frame-3">
            <div class="frame-31" data-message="; Click or press / to talk to me!">
                <div class="orange-square"></div>
                <span class="name">Sanju Singh</span>
            </div>
            <div class="frame-2">
                <span class="roles">Product Designer</span>
            </div>
        </div>

        <header class="heading" data-message=": Leave a mark on the wall">
            <h1>A public canvas for passing thoughts & tiny doodles.</h1>
            <h2>A public wall of everyone who wandered through this corner of the internet.</h2>
        </header>

        <nav class="nav-bar">
            <a href="index.html" class="nav-tab">Work</a>
            <a href="sidequest.html" class="nav-tab">Side Quest</a>
            <a href="notes.html" class="nav-tab active">Notes</a>
            <a href="about.html" class="nav-tab">About</a>
        </nav>

        <section class="notes-section">
            <div class="note-composer-wrapper" id="noteComposer">
                <form class="note-composer-box" id="noteForm">
                    <div class="composer-header">
                        <span>: NEW NOTE // PUBLIC WALL</span>
                        <button type="button" class="composer-close" id="closeComposer">[ cancel ]</button>
                    </div>

                    <textarea id="noteMessage" class="note-textarea" rows="3" maxlength="280" placeholder="write whatever is on your mind..."></textarea>

                    <div class="doodle-toggle-row">
                        <button type="button" class="doodle-toggle-btn" id="toggleDoodleBtn">
                            <span id="doodleArrow">▸</span> or leave a little drawing
                        </button>
                    </div>

                    <div class="doodle-pad-wrapper" id="doodlePadWrapper">
                        <div class="doodle-toolbar">
                            <div class="color-swatches">
                                <button type="button" class="color-swatch active" data-color="#DC5C2C" style="background: #DC5C2C;"></button>
                                <button type="button" class="color-swatch" data-color="#32404F" style="background: #32404F;"></button>
                                <button type="button" class="color-swatch" data-color="#2563EB" style="background: #2563EB;"></button>
                                <button type="button" class="color-swatch" data-color="#2E7D32" style="background: #2E7D32;"></button>
                            </div>
                            <div class="doodle-actions">
                                <select id="brushSize" class="doodle-select">
                                    <option value="2">fine</option>
                                    <option value="4">medium</option>
                                    <option value="8">bold</option>
                                </select>
                                <button type="button" class="doodle-action-btn" id="undoDoodle">undo</button>
                                <button type="button" class="doodle-action-btn" id="clearDoodle">clear</button>
                            </div>
                        </div>
                        <canvas id="doodleCanvas" width="520" height="200"></canvas>
                    </div>

                    <div class="composer-footer">
                        <input type="text" id="noteAuthor" class="note-author-input" maxlength="32" placeholder="Your name or @handle (optional)" />
                        <button type="submit" class="note-submit-btn" id="submitNoteBtn">Post note ↗</button>
                    </div>
                </form>
            </div>

            <div class="notes-masonry" id="notesMasonry">
                <button type="button" class="new-note-trigger" id="openComposerBtn" data-message="; write something nice!">
                    <span>+ New note</span>
                </button>
                <div id="notesListContainer" style="display: contents;"></div>
            </div>
        </section>
    </main>

    <footer class="footer" data-message="; don't be shy, say hello...">
        <a href="mailto:isanjukatariya@gmail.com" class="footer-link">isanjukatariya@gmail.com</a>
        <a href="https://www.instagram.com/isanjukatariya" class="footer-link" target="_blank" rel="noopener">Instagram</a>
        <a href="https://www.linkedin.com/in/isanjusingh/" class="footer-link" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://www.behance.net/sanjukatariya" class="footer-link" target="_blank" rel="noopener">Behance</a>
        <a href="https://x.com/isanjukatariya" class="footer-link" target="_blank" rel="noopener">X</a>
    </footer>

    <script src="script.js"></script>
</body>
</html>
